name: Build SleepPlugin

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: ./gradlew build
    
    - name: Upload platform artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SleepPlugin-${{ github.sha }}
        path: |
          platform-bukkit/build/libs/*.jar
          platform-fabric/build/libs/*.jar
          platform-quilt/build/libs/*.jar
          platform-forge/build/libs/*.jar
          platform-neoforge/build/libs/*.jar
        retention-days: 30
        
    - name: Display build info
      run: |
        echo "Build completed successfully!"
        echo "Artifacts:"
        ls -lh platform-bukkit/build/libs/ || true
        ls -lh platform-fabric/build/libs/ || true
        ls -lh platform-quilt/build/libs/ || true
        ls -lh platform-forge/build/libs/ || true
        ls -lh platform-neoforge/build/libs/ || true
